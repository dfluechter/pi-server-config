# ==============================================================================
# Jellyfin Systemd Override (Raspberry Pi 5 - 4GB RAM Optimierung)
# Pfad: /etc/systemd/system/jellyfin.service.d/jellyfin.service.conf
# ==============================================================================

[Service]
# 1. .NET Speichermanagement für Systeme mit wenig RAM (4 GB)
# Workstation GC gibt freien Speicher sofort wieder an das OS zurück
Environment="DOTNET_gcServer=0"
Environment="DOTNET_GCHeapHardLimit=0x28000000"
Environment="DOTNET_GCHighMemPercent=70"
Environment="MALLOC_TRIM_THRESHOLD_=65536"

# 2. Systemd RAM-Limits (schützt PaperMC & Pi-hole vor OOM-Abstürzen)
MemoryAccounting=true
MemoryHigh=600M
MemoryMax=850M

# 3. CPU- und I/O-Priorität leicht senken, damit DNS & Minecraft ruckelfrei bleiben
CPUWeight=80
IOWeight=80

# 4. Automatischer Neustart bei unerwarteten Fehlern
Restart=on-failure
RestartSec=10
