server:
    # Log-Einstellungen (minimal für Performance und SD-Karten-Schonung)
    verbosity: 0

    # Lausche nur lokal auf Port 5335
    interface: 127.0.0.1
    port: 5335
    do-ip4: yes
    do-udp: yes
    do-tcp: yes

    # IPv6-Unterstützung (da dein Telekom Speedport natives IPv6 nutzt)
    do-ip6: yes
    prefer-ip6: no

    # Sicherheit & Hardening (DNSSEC)
    harden-glue: yes
    harden-dnssec-stripped: yes
    use-caps-for-id: no

    # EDNS Buffer Size nach aktuellem Flag-Day-Standard (verhindert Fragmentierung)
    edns-buffer-size: 1232

    # Performance & Caching (Prefetching hält häufig genutzte Domains im Cache)
    prefetch: yes
    num-threads: 2
    so-rcvbuf: 1m

    # Schutz privater IP-Bereiche (RFC1918)
    private-address: 192.168.0.0/16
    private-address: 169.254.0.0/16
    private-address: 172.16.0.0/12
    private-address: 10.0.0.0/8
    private-address: fd00::/8
    private-address: fe80::/10
