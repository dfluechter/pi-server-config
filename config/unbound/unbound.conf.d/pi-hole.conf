# ==============================================================================
# Unbound Konfiguration für Pi-hole v6 (Raspberry Pi 5 - 4GB RAM)
# Pfad: /etc/unbound/unbound.conf.d/pi-hole.conf
# ==============================================================================
server:
    verbosity: 0
    interface: 127.0.0.1
    port: 5335
    do-ip4: yes
    do-udp: yes
    do-tcp: yes

    # IPv6-Upstream nur aktivieren, wenn natives IPv6 stabil anliegt (vermeidet Timeouts)
    do-ip6: no
    prefer-ip6: no

    # Sicherheit & Hardening
    harden-glue: yes
    harden-dnssec-stripped: yes
    use-caps-for-id: no
    edns-buffer-size: 1232
    hide-identity: yes
    hide-version: yes

    # Performance & Cache-Tuning für Raspberry Pi 5 (4 Kerne, 4 GB RAM)
    num-threads: 4
    msg-cache-slabs: 4
    rrset-cache-slabs: 4
    infra-cache-slabs: 4
    key-cache-slabs: 4

    # 64 MB RRset-Cache & 32 MB Message-Cache (ideal für 4 GB RAM neben PaperMC/Jellyfin)
    rrset-cache-size: 64m
    msg-cache-size: 32m
    so-rcvbuf: 1m

    # Sofortige Antworten durch Prefetching & Serve-Expired
    prefetch: yes
    prefetch-key: yes
    serve-expired: yes
    serve-expired-ttl: 86400
    cache-min-ttl: 300

    # Schutz vor DNS-Rebinding im lokalen Speedport-Netz
    private-address: 192.168.0.0/16
    private-address: 169.254.0.0/16
    private-address: 172.16.0.0/12
    private-address: 10.0.0.0/8
    private-address: fd00::/8
    private-address: fe80::/10
