# ==============================================================================
# Unbound Konfiguration für Pi-hole v6 (Raspberry Pi 5 - 4 GB RAM)
# Pfad: /etc/unbound/unbound.conf.d/pi-hole.conf
# ==============================================================================
server:
    verbosity: 0

    # Lausche ausschließlich lokal auf Port 5335 für Pi-hole
    interface: 127.0.0.1
    port: 5335
    access-control: 127.0.0.0/8 allow
    access-control: 0.0.0.0/0 refuse

    do-ip4: yes
    do-udp: yes
    do-tcp: yes

    # IPv6-Upstream deaktiviert (verhindert Timeouts bei instabilem IPv6-Routing)
    do-ip6: no
    prefer-ip6: no

    # Sicherheit, DNSSEC-Hardening & Privacy
    harden-glue: yes
    harden-dnssec-stripped: yes
    use-caps-for-id: no
    edns-buffer-size: 1232
    unwanted-reply-threshold: 10000
    do-not-query-localhost: no
    hide-identity: yes
    hide-version: yes

    # Performance & Cache-Tuning für Raspberry Pi 5 (4 Kerne, 4 GB RAM)
    num-threads: 4
    msg-cache-slabs: 4
    rrset-cache-slabs: 4
    infra-cache-slabs: 4
    key-cache-slabs: 4

    # 64 MB RRset-Cache & 32 MB Message-Cache (~180 MB Gesamt-RAM-Bedarf)
    rrset-cache-size: 64m
    msg-cache-size: 32m
    so-rcvbuf: 1m

    # Sofortige Antworten durch Prefetching & Serve-Expired
    prefetch: yes
    prefetch-key: yes
    serve-expired: yes
    serve-expired-ttl: 86400
    cache-min-ttl: 300
    cache-max-ttl: 86400

    # Schutz vor DNS-Rebinding im lokalen Heimnetz
    private-address: 192.168.0.0/16
    private-address: 169.254.0.0/16
    private-address: 172.16.0.0/12
