name: Validate Server Configs

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  validate:
    name: Bash, Python, YAML/TOML/XML & Security Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: 1. Check Bash Scripts (bash -n & ShellCheck)
        run: |
          echo "=== Prüfe alle Bash-Skripte per Dateiendung oder Shebang ==="
          bash_count=0
          while IFS= read -r -d '' file; do
            first_line=$(head -n 1 "$file" 2>/dev/null || true)
            if [[ "$file" == *.sh ]] || [[ "$first_line" =~ ^#!.*(bash|sh) ]]; then
              echo "[BASH] Prüfe Syntax & ShellCheck: $file"
              bash -n "$file"
              shellcheck --severity=error "$file"
              bash_count=$((bash_count + 1))
            fi
          done < <(find scripts config/system/usr_local_bin minecraft -type f -print0 2>/dev/null)
          echo "[OK] $bash_count Bash-Skript(e) erfolgreich geprüft."

      - name: 2. Check Python Scripts (py_compile)
        run: |
          echo "=== Prüfe alle Python-Skripte (z. B. jellyfin-rename) ==="
          py_count=0
          while IFS= read -r -d '' file; do
            first_line=$(head -n 1 "$file" 2>/dev/null || true)
            if [[ "$file" == *.py ]] || [[ "$first_line" =~ ^#!.*python ]]; then
              echo "[PYTHON] Kompiliere Syntax-Check: $file"
              python3 -m py_compile "$file"
              py_count=$((py_count + 1))
            fi
          done < <(find scripts config/system/usr_local_bin minecraft -type f -print0 2>/dev/null)
          echo "[OK] $py_count Python-Skript(e) erfolgreich geprüft."

      - name: 3. Validate YAML, TOML & XML Configurations
        run: |
          echo "=== Prüfe YAML, TOML & XML Konfigurationsdateien ==="
          python3 -c '
          import pathlib, sys, yaml, tomllib
          import xml.etree.ElementTree as ET

          errors = 0
          for p in pathlib.Path(".").rglob("*"):
              if ".git" in p.parts or not p.is_file():
                  continue
              if p.suffix in (".yml", ".yaml"):
                  try:
                      with p.open("r", encoding="utf-8") as f:
                          yaml.safe_load(f)
                      print(f"[OK] YAML: {p}")
                  except Exception as e:
                      print(f"[ERROR] YAML {p}: {e}", file=sys.stderr)
                      errors += 1
              elif p.suffix == ".toml":
                  try:
                      with p.open("rb") as f:
                          tomllib.load(f)
                      print(f"[OK] TOML: {p}")
                  except Exception as e:
                      print(f"[ERROR] TOML {p}: {e}", file=sys.stderr)
                      errors += 1
              elif p.suffix == ".xml":
                  try:
                      ET.parse(p)
                      print(f"[OK] XML:  {p}")
                  except Exception as e:
                      print(f"[ERROR] XML {p}: {e}", file=sys.stderr)
                      errors += 1

          if errors > 0:
              sys.exit(1)
          '

      - name: 4. Security & Repository Hygiene Check
        run: |
          echo "=== Prüfe auf Klartext-Passwörter in config/system/fstab ==="
          if [ -f "config/system/fstab" ]; then
            if grep -E "(password|pass)=[^*[:space:],]+" config/system/fstab; then
              echo "FEHLER: Unmaskiertes Passwort in config/system/fstab gefunden!"
              exit 1
            fi
            echo "[OK] fstab ist sauber maskiert."
          fi

          echo "=== Prüfe auf versehentlich eingecheckte Systemd-Symlinks oder große ZIPs ==="
          if [ -d "config/system/systemd" ] && find config/system/systemd -type l | grep -q .; then
            echo "FEHLER: Systemd-Symlinks in config/system/systemd gefunden!"
            exit 1
          fi
          if find . -path ./.git -prune -o -name "*.zip" -print | grep -q .; then
            echo "FEHLER: ZIP-Archiv im Repository gefunden!"
            exit 1
          fi
          echo "[OK] Keine Symlinks oder ZIP-Archive vorhanden."
