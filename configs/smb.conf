[global]
   workgroup = WORKGROUP
   server string = Raspi5 Samba Server
   netbios name = RASPI5

   # Moderne Protokolle & Performance für Raspberry Pi 5
   server min protocol = SMB2
   dns proxy = no
   log file = /var/log/samba/log.%m
   max log size = 1000
   logging = file
   panic action = /usr/share/samba/panic-action %d
   server role = standalone server
   obey pam restrictions = yes
   unix password sync = yes
   passwd program = /usr/bin/passwd %u
   passwd chat = *Enter\snew\s*\spassword:* %n\n *Retype\snew\s*\spassword:* %n\n *password\supdated\ssuccessfully* .
   pam password change = yes
   map to guest = bad user

   # Druckerdienste deaktivieren
   load printers = no
   printing = bsd
   printcap name = /dev/null
   disable spoolss = yes

[pi-config]
   comment = Pi Server Config Repository
   path = /home/raspi/pi-server-config
   browseable = yes
   read only = no
   guest ok = no
   valid users = raspi
   create mask = 0664
   directory mask = 0775

[speedport-media]
   comment = Speedport USB Festplatte via Raspi5
   path = /mnt/speedport-usb
   browseable = yes
   read only = no
   guest ok = no
   valid users = raspi
   force user = jellyfin
   create mask = 0664
   directory mask = 0775
