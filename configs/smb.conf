[global]
   workgroup = WORKGROUP
   server string = Sensor-Pi NAS
   server role = standalone server
   log file = /var/log/samba/log.%m
   max log size = 1000
   logging = file
   map to guest = Bad User
   min protocol = SMB2
   # Deaktiviere unnoetige Druckdienste
   load printers = no
   printing = bsd
   printcap name = /dev/null
   disable spoolss = yes
   # Performance-Optimierung fuer Raspberry Pi 5 + NVMe
   socket options = TCP_NODELAY IPTOS_LOWDELAY
   use sendfile = yes
   aio read size = 16384
   aio write size = 16384

[NAS-Medien]
   comment = Jellyfin Medien und Netzwerk-Share
   path = /srv/nas
   browseable = yes
   read only = no
   guest ok = no
   valid users = raspi
   force user = raspi
   force group = raspi
   create mask = 0664
   directory mask = 0775
